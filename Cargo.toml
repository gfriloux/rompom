[package]
edition = "2021"
authors = ["Guillaume Friloux <guillaume@friloux.me>"]
name = "rompom"
version = "0.20.0"

# Every version below is the one Cargo.lock already resolves. They used to be `*`,
# which says "any version ever published": a fresh checkout without the lockfile —
# `cargo install`, a vendoring tool, a distribution packager — could resolve a major
# version this code has never been compiled against, and the failure would land on
# whoever built it rather than here.
[dependencies]
screenscraper = { git = "https://github.com/gfriloux/screenscraper", tag = "v0.8.0" }
#screenscraper = { path = "../screenscraper" }
internet_archive = { git = "https://github.com/gfriloux/internetarchive", tag = "v0.3.0" }
sha1 = "0.11.0"
md-5 = "0.11.0"
crc32fast = "1.5.0"
chrono = "0.4.45"
dirs = "6.0.0"
getopts = "0.2.24"
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
serde_json = "1.0.149"
# 0.9.34+deprecated is the last release: the crate is archived. Pinned so the dead end
# is visible here rather than discovered at the next `cargo update`.
serde_yaml = "0.9.34"
snafu = "0.7.5"
reqwest = { version = "0.11.27", features = ["blocking"] }
openssl = { version = "0.10.80", features = ["vendored"] }
glob = "0.3.1"
crossbeam-channel = "0.5"
minijinja = "2"
ctrlc = "3"

# Size optimisations for the released binary. These lived in the Nix package as
# CARGO_PROFILE_RELEASE_* environment variables, which override this table — keeping both
# would have been two sources of truth with no gate to catch them drifting apart.
#
# panic = "abort" is deliberately NOT set. The worker pool catches a panicking step
# handler and turns it into a failed ROM so the rest of the run completes; aborting kills
# the process instead, and the catch_unwind becomes dead code in exactly the build users
# run. That is not a theoretical worry — the Nix package did set it until 2026-08-09.
#
# Measured that day on x86_64-unknown-linux-musl: 11 117 480 bytes with panic=abort
# against 11 600 808 without. Unwinding costs 483 KB (+4.3%) on a binary already dominated
# by vendored OpenSSL. A run that dies halfway through costs more than 4% of size.
[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
