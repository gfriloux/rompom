# git-cliff configuration — CHANGELOG.md is generated from Conventional Commits.
# Regenerate with `just changelog`, then review the diff before committing.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to rompom. Format inspired by [Keep a Changelog], versions follow
[SemVer]. Generated from [Conventional Commits] by git-cliff — do not edit by hand,
run `just changelog` instead.

Entries for **v0.15.0 and earlier** were written by hand before this repository adopted
git-cliff; they are preserved verbatim, with far more detail, in
[`CHANGELOG-legacy.md`](./CHANGELOG-legacy.md).

[Keep a Changelog]: https://keepachangelog.com/en/1.1.0/
[SemVer]: https://semver.org/
[Conventional Commits]: https://www.conventionalcommits.org/

"""

body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** — {% endif %}\
{% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | split(pat="\n") | first | upper_first }}\
{% if commit.breaking %} — {{ commit.breaking_description | split(pat="\n") | join(sep=" ") | trim }}{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/gfriloux/rompom/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

footer = """
<!-- generated by git-cliff -->
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# Only keep commits matching a parser below — protects the changelog from noise.
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "newest"

# Order matters: the first matching parser wins.
commit_parsers = [
  # Historical mislabels: version bumps and lockfile updates were committed as `feat(all)`.
  # Going forward these must be `chore(release):` / `chore(deps):` (cf. PROCEDURE_PLANS.md §3).
  { message = "(?i)^(feat|chore).*bump version", skip = true },
  { message = "(?i)^(feat|chore).*cargo[ ._-]?lock", group = "<!-- 8 -->Dependencies" },
  { message = "(?i)^(feat|chore).*cargo update", group = "<!-- 8 -->Dependencies" },
  # The changelog is generated now, so commits that used to hand-write it are pure noise.
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "(?i)^docs.*add v[0-9]", skip = true },

  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->Continuous integration" },
  { message = "^chore\\(deps\\)", group = "<!-- 8 -->Dependencies" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  # A dependency change is a dependency change whether it was committed as chore or as
  # build. v0.18.0 split `build(deps): pin every dependency` from `chore(deps): drop
  # serde_derive` across two sections, and a reader has no way to know they belong together.
  { message = "^build\\(deps\\)", group = "<!-- 8 -->Dependencies" },
  { message = "^build", group = "<!-- 7 -->Miscellaneous" },
  { message = "^merge", skip = true },
  { message = ".*", skip = true },
]
